version: 2
updates:
  # The release workflow pins actions to major tags; this keeps those majors current
  # rather than letting them silently age out of support.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # Package versions are pinned exactly in the csproj; this is how they get bumped.
  - package-ecosystem: nuget
    directory: /ButlerUtility.App
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
